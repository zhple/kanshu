<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>看书 · 写作</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h1>看书写作</h1>
        <p class="hint">与手机端共享书库 · 专注读写</p>
        <p id="app-version" class="version-label">v—</p>
      </div>
      <button id="btn-back" class="btn ghost sidebar-back hidden" type="button">← 返回</button>
      <div id="sidebar-editor-tools" class="sidebar-editor-tools hidden">
        <div class="side-section side-section-grow">
          <div class="side-section-title">章节大纲</div>
          <ul id="outline-list" class="outline-list">
            <li class="meta">插入「下一章」后显示</li>
          </ul>
        </div>
      </div>
      <div class="sidebar-foot">
        <button id="btn-check-update" class="btn secondary" type="button">检查更新</button>
        <button id="btn-settings" class="btn ghost" type="button">设置</button>
      </div>
    </aside>

    <main class="main-pane">
      <section id="hub-panel" class="hub-panel">
        <div id="hub-content" class="hub-content"></div>
        <p id="hub-status" class="status hub-status"></p>
      </section>

      <section id="editor-panel" class="editor-panel hidden">
        <header class="toolbar">
          <input id="title-input" type="text" placeholder="文稿标题" />
          <div class="toolbar-actions">
            <button id="btn-prev-page" class="btn ghost" title="上一页">←</button>
            <span id="page-label">第 1 / 1 页</span>
            <button id="btn-next-page" class="btn ghost" title="下一页">→</button>
            <span class="sep"></span>
            <button id="btn-chapter" class="btn secondary">下一章</button>
            <button id="btn-image" class="btn secondary">插图</button>
            <button id="btn-focus" class="btn ghost">专注</button>
            <button id="btn-save" class="btn primary">保存</button>
            <button id="btn-upload" class="btn secondary">上传 GitHub</button>
          </div>
        </header>
        <div class="stats-bar">
          <span id="stats-text">0 字 · 今日 0 / 1000</span>
          <div class="goal-track"><div id="goal-fill" class="goal-fill"></div></div>
          <span id="dirty-badge" class="dirty-badge hidden">未保存</span>
        </div>
        <p id="page-title" class="page-title">正文</p>
        <p id="page-subtitle" class="page-subtitle">第 1 / 1 页</p>
        <div id="blocks" class="blocks"></div>
        <p id="status" class="status"></p>
      </section>
    </main>
  </div>

  <dialog id="new-draft-dialog">
    <form method="dialog" id="new-draft-form">
      <h2>新建文稿</h2>
      <label for="new-draft-title">标题</label>
      <input id="new-draft-title" type="text" value="未命名" autocomplete="off" />
      <label for="new-draft-folder">分类</label>
      <select id="new-draft-folder"></select>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost" type="submit">取消</button>
        <button value="ok" class="btn primary" type="submit">创建</button>
      </div>
    </form>
  </dialog>

  <dialog id="chapter-dialog">
    <form method="dialog" id="chapter-form">
      <h2>开始新章节</h2>
      <p class="hint">相当于换一张空白纸；章节名会出现在大纲里。</p>
      <label for="chapter-subtitle">章节名（可选）</label>
      <input id="chapter-subtitle" type="text" placeholder="例如：雨夜" autocomplete="off" />
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost" type="submit">取消</button>
        <button value="ok" class="btn primary" type="submit">开始写</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h2>设置</h2>
      <label>GitHub Token（勾选 repo）</label>
      <input id="cfg-token" type="password" placeholder="ghp_..." autocomplete="off" />
      <label>仓库 Owner</label>
      <input id="cfg-owner" type="text" value="zhple" />
      <label>仓库名</label>
      <input id="cfg-repo" type="text" value="kanshu" />
      <label>分支</label>
      <input id="cfg-branch" type="text" value="main" />
      <label>每日写作目标（字）</label>
      <input id="cfg-goal" type="number" min="100" max="50000" value="1000" />
      <p class="hint" style="margin:12px 0 8px">工作目录请在首页选择；共享书库位于工作目录下的 default-books。</p>
      <label class="check-row">
        <input id="cfg-auto-update" type="checkbox" checked />
        启动时自动检查更新
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">取消</button>
        <button value="ok" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="update-progress" class="update-progress hidden" aria-live="polite">
    <div class="update-progress-card">
      <div id="update-progress-title" class="update-progress-title">正在下载更新</div>
      <div class="update-progress-track">
        <div id="update-progress-fill" class="update-progress-fill"></div>
      </div>
      <div id="update-progress-text" class="update-progress-text">0%</div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
